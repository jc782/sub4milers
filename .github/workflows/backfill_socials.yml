name: Backfill Athlete Instagram Handles (Web Search)

on:
  workflow_dispatch:
    inputs:
      since_year:
        description: 'Search athletes who debuted in or after this year'
        required: false
        default: '2000'
      limit:
        description: 'Optional max athletes to query (0 = all)'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  backfill-socials:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Serper/Web Search Instagram Backfill
        env:
          DEBUG: 'True'
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_SEARCH_CX: ${{ secrets.GOOGLE_SEARCH_CX }}
          SINCE_YEAR: ${{ github.event.inputs.since_year || '2000' }}
          SEARCH_LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: |
          python manage.py find_athlete_socials --search-since "$SINCE_YEAR" --search-limit "$SEARCH_LIMIT"

      - name: Commit and push updated database and CSVs
        run: |
          if [ -n "$(git status --porcelain db.sqlite3 static/data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add db.sqlite3 static/data/sub4_instagram_handles.csv static/data/sub4_all_athletes_socials.csv
            git commit -m "Backfill post-${{ github.event.inputs.since_year || '2000' }} Instagram handles via Serper search"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No new Instagram handles matched."
          fi
