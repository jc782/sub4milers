name: Update Sub-4 Milers from World Athletics

on:
  schedule:
    # Run weekly every Monday at 07:17 UTC (off-minute avoids GitHub Actions top-of-hour cron drops)
    - cron: '17 7 * * 1'
  workflow_dispatch:
    inputs:
      year:
        description: 'Season year to scrape (leave blank for current year)'
        required: false
        default: ''
      discover_recent_socials:
        description: 'Optional: generate a Social Collab Issue for the N most recent inductees (e.g. 10)'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape World Athletics Sub-4 Mile Toplist
        env:
          DEBUG: 'True'
          INPUT_YEAR: ${{ github.event.inputs.year }}
        run: |
          if [ -n "$INPUT_YEAR" ]; then
            python manage.py scrape_world_athletics --year $INPUT_YEAR --output-new-athletes /tmp/new_athletes.json
          else
            python manage.py scrape_world_athletics --output-new-athletes /tmp/new_athletes.json
          fi

      - name: Discover Instagram & Strava accounts for new inductees
        env:
          DEBUG: 'True'
          RECENT_COUNT: ${{ github.event.inputs.discover_recent_socials }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_SEARCH_CX: ${{ secrets.GOOGLE_SEARCH_CX }}
        run: |
          if [ -n "$RECENT_COUNT" ]; then
            python manage.py find_athlete_socials --recent "$RECENT_COUNT" --markdown-output /tmp/new_sub4_socials.md
          elif [ -f /tmp/new_athletes.json ] && [ "$(cat /tmp/new_athletes.json)" != "[]" ]; then
            python manage.py find_athlete_socials --from-file /tmp/new_athletes.json --markdown-output /tmp/new_sub4_socials.md
          else
            echo "No newly inducted athletes requiring social lookup."
          fi

      - name: Generate Instagram Cards & This Week in Sub-4 History Digest
        env:
          DEBUG: 'True'
        run: |
          python manage.py generate_insta_content --skip-reels

      - name: Build static site into docs/ and build/
        env:
          DEBUG: 'True'
        run: |
          python manage.py build_static

      - name: Commit and push updates if database or pages changed
        run: |
          if [ -n "$(git status --porcelain db.sqlite3 static/instagram/ docs/ build/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add db.sqlite3 static/instagram/ docs/ build/
            git commit -m "Automated World Athletics sub-4 update ($(date -u +'%Y-%m-%d'))"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No new sub-4 performances found."
          fi

      - name: Open Weekly GitHub Issue (New Sub-4 Runners + This Week in History)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > /tmp/weekly_issue_body.md
          # Weekly Sub-4 Register Dispatch
          EOF

          if [ -s /tmp/new_sub4_socials.md ]; then
            echo "" >> /tmp/weekly_issue_body.md
            cat /tmp/new_sub4_socials.md >> /tmp/weekly_issue_body.md
          else
            cat << 'EOF' >> /tmp/weekly_issue_body.md

          ## New First-Time Sub-4 Milers This Week
          _No brand-new first-time sub-4:00 mile runners were added to the World Athletics toplist this week._
          EOF
          fi

          if [ -s static/instagram/on_this_day/this_week_digest.md ]; then
            echo -e "\n---\n" >> /tmp/weekly_issue_body.md
            cat static/instagram/on_this_day/this_week_digest.md >> /tmp/weekly_issue_body.md
            echo -e "\n**Generated Card Image:** [\`static/instagram/on_this_day/this_week_in_sub4_history.png\`](https://github.com/${{ github.repository }}/blob/master/static/instagram/on_this_day/this_week_in_sub4_history.png)" >> /tmp/weekly_issue_body.md
          fi

          echo -e "\n---\ncc @${{ github.repository_owner }}" >> /tmp/weekly_issue_body.md

          gh issue create \
            --title "Weekly Sub-4 Dispatch — New Runners & This Week in History ($(date -u +'%Y-%m-%d'))" \
            --assignee "${{ github.repository_owner }}" \
            --body-file /tmp/weekly_issue_body.md



