name: Update Sub-4 Milers from World Athletics

on:
  schedule:
    # Run weekly every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      year:
        description: 'Season year to scrape (leave blank for current year)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape World Athletics Sub-4 Mile Toplist
        env:
          DEBUG: 'True'
          INPUT_YEAR: ${{ github.event.inputs.year }}
        run: |
          if [ -n "$INPUT_YEAR" ]; then
            python manage.py scrape_world_athletics --year $INPUT_YEAR
          else
            python manage.py scrape_world_athletics
          fi

      - name: Build static site into docs/ and build/
        env:
          DEBUG: 'True'
        run: |
          python manage.py build_static

      - name: Commit and push updates if database or pages changed
        run: |
          if [ -n "$(git status --porcelain db.sqlite3 docs/ build/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add db.sqlite3 docs/ build/
            git commit -m "Automated World Athletics sub-4 update ($(date -u +'%Y-%m-%d'))"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No new sub-4 performances found."
          fi
